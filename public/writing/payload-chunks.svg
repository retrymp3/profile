<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="payloadTitle payloadDesc">
  <title id="payloadTitle">Base64 chunks reassembled into a script</title>
  <desc id="payloadDesc">A recon script is stopped by the chat filter, chopped into meaningless base64 scraps, appended into a file under /mnt/data, then decoded and run.</desc>
  <style>
  .canvas { fill: #f5f5f7; }
  .card { fill: #ffffff; }
  .ink { fill: #1d1d1f; }
  .muted { fill: #6e6e73; }
  .accent { fill: #0066cc; }
  .onpill { fill: #ffffff; }
  .pill { fill: #1d1d1f; }
  .chip { fill: #f5f5f7; }
  .warn { fill: #ffe8c2; }
  .info { fill: #d6ecff; }
  .ok { fill: #e7f8ec; }
  .tape { fill: #f5c16c; }
  .paper { fill: #fff7e8; }
  .term { fill: #f5f5f7; }
  .termok { fill: #248a3d; }
  .termmuted { fill: #6e6e73; }
  .danger { fill: #ff3b30; }
  .hair { stroke: #1d1d1f; }
  .faint { stroke: #c7c7cc; }
  .arrow { stroke: #86868b; }
  .danger-stroke { stroke: #ff3b30; }
  .outline { stroke: rgba(0, 0, 0, 0.12); }
  @media (prefers-color-scheme: dark) {
    .canvas { fill: #2c2c2e; }
    .card { fill: #1c1c1e; }
    .ink { fill: #f5f5f7; }
    .muted { fill: #a1a1a6; }
    .accent { fill: #2997ff; }
    .onpill { fill: #1d1d1f; }
    .pill { fill: #f5f5f7; }
    .chip { fill: #2c2c2e; }
    .warn { fill: #3d3424; }
    .info { fill: #1c3348; }
    .ok { fill: #14301c; }
    .tape { fill: #c48a2a; }
    .paper { fill: #3d3424; }
    .term { fill: #000000; }
    .termok { fill: #30d158; }
    .termmuted { fill: #a1a1a6; }
    .hair { stroke: #f5f5f7; }
    .faint { stroke: rgba(255, 255, 255, 0.22); }
    .outline { stroke: rgba(255, 255, 255, 0.14); }
  }
</style>
  <rect class="canvas" width="1120" height="440" rx="16"/>

  <g fill="none" class="arrow" stroke-width="2" stroke-linecap="round">
    <path d="M268 196h28"/>
    <path d="M288 190l8 6-8 6"/>
    <path d="M534 196h28"/>
    <path d="M554 190l8 6-8 6"/>
    <path d="M800 196h28"/>
    <path d="M820 190l8 6-8 6"/>
  </g>
  <g>
    <rect class="card" x="28" y="48" width="232" height="300" rx="18"/>
    <rect class="card hair" x="78" y="92" width="108" height="132" rx="8" fill="none" stroke-width="2"/>
    <rect class="card" x="80" y="94" width="104" height="128" rx="6"/>
    <text class="ink" x="132" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">recon.sh</text>
    <g class="faint" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M96 136h72"/>
      <path d="M96 152h58"/>
      <path d="M96 168h66"/>
      <path d="M96 184h40"/>
    </g>
    <circle class="ink" cx="118" cy="200" r="3"/>
    <circle class="ink" cx="136" cy="200" r="3"/>
    <path class="hair" d="M116 210q10 8 20 0" fill="none" stroke-width="2" stroke-linecap="round"/>
    <rect class="danger" x="168" y="118" width="16" height="108" rx="4"/>
    <path d="M176 132v80" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text class="ink" x="144" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Real script</text>
    <text class="muted" x="144" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Chat filter stops it</text>
  </g>
  <g>
    <rect class="card" x="304" y="48" width="232" height="300" rx="18"/>
    <g transform="rotate(-8 360 150)">
      <rect class="warn hair" x="330" y="108" width="78" height="36" rx="6" stroke-width="1.5"/>
      <text class="ink" x="369" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">aGVsbG8=</text>
    </g>
    <g transform="rotate(6 430 168)">
      <rect class="info hair" x="392" y="146" width="72" height="36" rx="6" stroke-width="1.5"/>
      <text class="ink" x="428" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">kJ8q2+</text>
    </g>
    <g transform="rotate(-3 390 214)">
      <rect class="ok hair" x="348" y="196" width="84" height="36" rx="6" stroke-width="1.5"/>
      <text class="ink" x="390" y="219" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">xQ9m==</text>
    </g>
    <text class="ink" x="420" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Meaningless chunks</text>
    <text class="muted" x="420" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Base64, split apart</text>
  </g>
  <g>
    <rect class="card" x="570" y="48" width="232" height="300" rx="18"/>
    <path class="paper hair" d="M646 96h92l18 18v108H646z" stroke-width="2"/>
    <path class="hair" d="M738 96v18h18" fill="none" stroke-width="2"/>
    <text class="ink" x="692" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">aGVsbG8=</text>
    <text class="ink" x="692" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">kJ8q2+</text>
    <text class="ink" x="692" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">xQ9m==</text>
    <rect class="tape" x="662" y="178" width="60" height="14" rx="2"/>
    <text class="ink" x="686" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Append the scraps</text>
    <text class="muted" x="686" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">/mnt/data/blob</text>
  </g>
  <g>
    <rect class="card" x="836" y="48" width="256" height="300" rx="18"/>
    <rect class="term outline" x="868" y="100" width="192" height="118" rx="10" stroke-width="1"/>
    <circle cx="886" cy="118" r="4" fill="#ff5f57"/>
    <circle cx="900" cy="118" r="4" fill="#febc2e"/>
    <circle cx="914" cy="118" r="4" fill="#28c840"/>
    <text class="termok" x="884" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">base64 -d blob</text>
    <text class="termok" x="884" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">| bash</text>
    <text class="termmuted" x="884" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">recon.sh</text>
    <text class="ink" x="964" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Decode and run</text>
    <text class="muted" x="964" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">The script is back</text>
  </g>
</svg>
